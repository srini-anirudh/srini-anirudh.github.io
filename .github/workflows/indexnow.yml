name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - "feed.xml"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Submit canonical URLs
        uses: actions/github-script@v7
        with:
          script: |
            const host = "srini-anirudh.github.io";
            const key = "8e6d4c1f75a341d9b7a2c0e489f563ab";
            const paths = [
              "/", "/research.html", "/blogs/", "/projects.html", "/about.html",
              "/blogs/vlm-architecture-gallery/", "/blogs/vision-encoders/",
              "/blogs/transformers-vs-vision-transformers/", "/blogs/position-embeddings/",
              "/blogs/normalization/", "/blogs/activation-functions/", "/blogs/optimizers/",
              "/blogs/evolution-of-architectures/", "/blogs/vision-transformers/",
              "/blogs/cnn-architectures/"
            ];
            const response = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "content-type": "application/json; charset=utf-8" },
              body: JSON.stringify({
                host,
                key,
                keyLocation: `https://${host}/${key}.txt`,
                urlList: paths.map(path => `https://${host}${path}`)
              })
            });
            if (!response.ok) {
              core.setFailed(`IndexNow returned ${response.status}: ${await response.text()}`);
            } else {
              core.info(`IndexNow accepted ${paths.length} canonical URLs.`);
            }
