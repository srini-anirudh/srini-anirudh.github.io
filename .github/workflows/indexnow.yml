name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - "feed.xml"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Submit canonical URLs
        uses: actions/github-script@v7
        with:
          script: |
            const host = "srini-anirudh.github.io";
            const key = "8e6d4c1f75a341d9b7a2c0e489f563ab";
            const paths = [
              "/", "/research.html", "/blogs/", "/projects.html", "/about.html",
              "/blogs/the-agent-evaluation-playbook/", "/blogs/what-autograd-actually-does/",
              "/blogs/why-transformers-do-not-explode/", "/blogs/choosing-the-next-token/",
              "/blogs/teaching-a-language-model-to-follow-instructions/", "/blogs/how-lora-changes-a-model-without-rewriting-it/",
              "/blogs/inside-an-ai-agent-harness/", "/blogs/memory-is-more-than-context/",
              "/blogs/how-multi-agent-systems-actually-coordinate/", "/blogs/reinforcement-learning-for-agents-from-first-principles/",
              "/blogs/talk-is-not-cheap/", "/blogs/why-fast-gpus-still-wait-for-memory/",
              "/blogs/why-gpus-are-built-for-deep-learning/",
              "/blogs/the-vlm-architecture-gallery/", "/blogs/inside-a-modern-vision-encoder/",
              "/blogs/one-transformer-two-modalities/", "/blogs/how-models-know-where-they-are/",
              "/blogs/the-geometry-of-normalization/", "/blogs/why-neural-networks-need-nonlinearity/", "/blogs/what-an-optimizer-actually-does/",
              "/blogs/evolution-of-ml-architectures/", "/blogs/an-image-is-a-sentence/",
              "/blogs/across-the-cnnverse/"
            ];
            const response = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "content-type": "application/json; charset=utf-8" },
              body: JSON.stringify({
                host,
                key,
                keyLocation: `https://${host}/${key}.txt`,
                urlList: paths.map(path => `https://${host}${path}`)
              })
            });
            if (!response.ok) {
              core.setFailed(`IndexNow returned ${response.status}: ${await response.text()}`);
            } else {
              core.info(`IndexNow accepted ${paths.length} canonical URLs.`);
            }
