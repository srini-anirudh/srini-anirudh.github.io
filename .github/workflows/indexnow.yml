name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - "feed.xml"
      - "llms.txt"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit every URL in the sitemap
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const host = "srini-anirudh.github.io";
            const key = "8e6d4c1f75a341d9b7a2c0e489f563ab";
            const xml = fs.readFileSync("sitemap.xml", "utf8");
            const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1]);
            const response = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "content-type": "application/json; charset=utf-8" },
              body: JSON.stringify({ host, key, keyLocation: `https://${host}/${key}.txt`, urlList: urls })
            });
            if (!response.ok) {
              core.setFailed(`IndexNow returned ${response.status}: ${await response.text()}`);
            } else {
              core.info(`IndexNow accepted ${urls.length} URLs.`);
            }
